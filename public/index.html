<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>杭城日报 DailyPaper</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="paper-shell">
      <header class="masthead">
        <div class="masthead__kicker">个人生活副刊</div>
        <h1>杭城日报</h1>
        <p>有什么想告诉我的新闻？</p>
      </header>

      <section class="editor-card" aria-labelledby="editor-title">
        <div>
          <p class="section-label">今日来稿</p>
          <h2 id="editor-title">向本刊投递电子稿件</h2>
        </div>

        <form id="entry-form" class="entry-form">
          <label>
            <span>撰稿人</span>
            <input
              id="nickname"
              name="nickname"
              maxlength="24"
              placeholder="例如：南城读报人"
              required
            />
          </label>

          <label>
            <span>正文</span>
            <textarea
              id="content"
              name="content"
              maxlength="2000"
              placeholder="写下今天值得刊登的一段话..."
              required
            ></textarea>
            <small>请保证您输入的内容可以公开。</small>
          </label>

          <label class="file-input">
            <span>图片</span>
            <input id="image" name="image" type="file" accept="image/*" />
            <small>可选，支持常见图片格式，单张不超过 5MB。</small>
          </label>

          <div class="form-actions">
            <p id="form-message" role="status" aria-live="polite"></p>
            <button type="submit">刊登日记</button>
          </div>
        </form>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
